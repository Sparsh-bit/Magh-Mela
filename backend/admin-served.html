<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MaghMela - Bookings Admin</title>
    <style>
      body{font-family:Inter,Segoe UI,Arial;margin:20px;background:#fff}
      h1{color:#3E2723}
      table{border-collapse:collapse;width:100%}
      th,td{padding:8px;border:1px solid #ddd;text-align:left}
      th{background:#FFECB3}
      .small{font-size:0.85rem;color:#666}
    </style>
  </head>
  <body>
    <h1>Bookings</h1>
    <p class="small">This admin page lists the most recent bookings. Data is served from <code>/api/bookings</code>.</p>
    <div id="root">Loading…</div>

    <script>
      async function load() {
        const root = document.getElementById('root');
        root.innerHTML = 'Loading…';
        try {
          const res = await fetch('/api/bookings');
          const data = await res.json();
          const bookings = data.bookings || [];
          if (!bookings.length) {
            root.innerHTML = '<p>No bookings yet.</p>';
            return;
          }

          const table = document.createElement('table');
          const thead = document.createElement('thead');
          thead.innerHTML = '<tr><th>#</th><th>Pickup</th><th>Destination</th><th>Date</th><th>Time</th><th>Pax</th><th>Price</th><th>Status</th><th>Created</th></tr>';
          table.appendChild(thead);
          const tbody = document.createElement('tbody');

          bookings.forEach((b, idx) => {
            const tr = document.createElement('tr');
            const created = new Date(b.createdAt).toLocaleString();
            tr.innerHTML = `
              <td>${idx + 1}</td>
              <td>${(b.pickupLocation && b.pickupLocation.text) || ''}</td>
              <td>${b.destinationGhat}</td>
              <td>${b.date}</td>
              <td>${b.timeSlot}</td>
              <td>${b.passengers}</td>
              <td>₹${b.price}</td>
              <td>${b.status}</td>
              <td>${created}</td>
            `;
            tbody.appendChild(tr);
          });

          table.appendChild(tbody);
          root.innerHTML = '';
          root.appendChild(table);
        } catch (err) {
          root.innerHTML = '<p>Error loading bookings. Check console for details.</p>';
          console.error(err);
        }
      }

      window.addEventListener('load', load);
    </script>
  </body>
</html>
